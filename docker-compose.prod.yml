# Produção (Coolify): usa as imagens publicadas no GHCR pelo GitHub Actions.
# Nada é compilado no servidor. Para desenvolvimento/local use docker-compose.yml.
#
# IMAGE_TAG: "latest" (padrão) ou "sha-<commit>" para fixar/voltar uma versão.
services:
  api:
    image: ghcr.io/kaaunty/amigo-chocolate-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/app.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (minimo 16 caracteres)}
      PUBLIC_URL: ${PUBLIC_URL:?Defina PUBLIC_URL com a URL publica, ex. https://chocolate.rainhadassete.com.br}
      CORS_ORIGIN: ${CORS_ORIGIN:-${PUBLIC_URL}}
      EMAIL_API_URL: ${EMAIL_API_URL:-https://api.erp.rainhadassete.com/api/Email/enviar}
      EMAIL_SEND_DELAY_MS: ${EMAIL_SEND_DELAY_MS:-0}
      # O nginx do serviço "web" fica à frente da API (usa X-Forwarded-For no rate limit)
      TRUST_PROXY: "true"
    volumes:
      - app-data:/data
    expose:
      - "3001"

  web:
    image: ghcr.io/kaaunty/amigo-chocolate-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Sem "ports": o Traefik do Coolify encaminha para a porta 80 do container.

volumes:
  app-data:
