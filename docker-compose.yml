# Amigo Chocolate: front (nginx) + API (Node/SQLite)
# Uso: copie .env.example para .env, defina ADMIN_PASSWORD e JWT_SECRET e rode `docker compose up -d --build`.
services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/app.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (minimo 16 caracteres)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-${PUBLIC_URL:-http://localhost:3000}}
      EMAIL_API_URL: ${EMAIL_API_URL:-https://api.erp.rainhadassete.com/api/Email/enviar}
      EMAIL_SEND_DELAY_MS: ${EMAIL_SEND_DELAY_MS:-0}
      # O nginx do serviço "web" é o proxy à frente da API (usa X-Forwarded-For no rate limit)
      TRUST_PROXY: "true"
    volumes:
      - app-data:/data
    expose:
      - "3001"

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  app-data:
